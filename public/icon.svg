<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Astrolabe Circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#ca8a04" stroke-width="3"/>

  <!-- Inner Sacred Myanmar Zodiac Ring (8 Directional Points) -->
  <g stroke="url(#goldGrad)" stroke-width="4">
    <line x1="256" y1="65" x2="256" y2="447" />
    <line x1="65" y1="256" x2="447" y2="256" />
    <line x1="121" y1="121" x2="391" y2="391" />
    <line x1="121" y1="391" x2="391" y2="121" />
  </g>

  <!-- Center Mandala & Star of Wisdom -->
  <circle cx="256" cy="256" r="110" fill="#1c1917" stroke="url(#goldGrad)" stroke-width="6"/>
  <polygon points="256,160 286,226 352,256 286,286 256,352 226,286 160,256 226,226" fill="url(#goldGrad)"/>
  
  <!-- Sacred Center Gem -->
  <circle cx="256" cy="256" r="28" fill="#e11d48" stroke="#fde047" stroke-width="3"/>
  <circle cx="256" cy="256" r="10" fill="#ffffff" opacity="0.8"/>
</svg>
