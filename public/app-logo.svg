<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldFeatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- 9-Grid Astrological Slate Board (မဟာဘုတ်/ဗေဒင်ဇာတာခွင်) -->
  <g transform="translate(45, 175) rotate(-10)">
    <rect
      x="20"
      y="20"
      width="260"
      height="180"
      rx="20"
      fill="url(#slateGrad)"
      stroke="url(#goldFeatherGrad)"
      stroke-width="5"
    />

    <!-- 3x3 Grid Lines -->
    <line x1="106" y1="20" x2="106" y2="200" stroke="url(#goldFeatherGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="193" y1="20" x2="193" y2="200" stroke="url(#goldFeatherGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="20" y1="80" x2="280" y2="80" stroke="url(#goldFeatherGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="20" y1="140" x2="280" y2="140" stroke="url(#goldFeatherGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Center Glyphs -->
    <ellipse cx="150" cy="110" rx="22" ry="16" stroke="#fde047" stroke-width="4" fill="none" transform="rotate(-15 150 110)" />
    <circle cx="150" cy="110" r="4" fill="#fde047" />
    <path d="M 168 104 Q 190 95 198 88" stroke="#fde047" stroke-width="3.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Artistic Hand Holding Feather Quill Pen -->
  <g>
    <path
      d="M 125 45 C 145 90, 160 145, 178 220"
      stroke="url(#goldFeatherGrad)"
      stroke-width="5"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M 125 45 C 95 90, 105 150, 140 185 C 130 155, 125 115, 125 45 Z"
      fill="url(#goldFeatherGrad)"
      opacity="0.95"
    />
    <path
      d="M 125 45 C 150 85, 165 130, 168 175 C 155 140, 140 95, 125 45 Z"
      fill="#fbbf24"
      opacity="0.9"
    />
    <path
      d="M 115 110 C 85 100, 60 130, 80 160 C 95 175, 115 170, 128 158"
      stroke="url(#goldFeatherGrad)"
      stroke-width="4"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M 85 170 C 110 160, 135 175, 160 200"
      stroke="url(#goldFeatherGrad)"
      stroke-width="4.5"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Fingers -->
    <path
      d="M 150 185 C 168 190, 185 200, 188 215 C 188 225, 172 230, 160 225 C 145 220, 138 205, 150 185 Z"
      stroke="url(#goldFeatherGrad)"
      stroke-width="4"
      fill="#1c1917"
    />
    <path
      d="M 175 220 C 185 240, 195 270, 195 295 C 190 305, 178 305, 172 290 C 165 265, 158 240, 155 225"
      stroke="url(#goldFeatherGrad)"
      stroke-width="4"
      stroke-linecap="round"
      fill="#1c1917"
    />
    <path
      d="M 158 235 C 152 260, 145 285, 140 300 C 132 305, 125 298, 128 285 C 133 265, 140 240, 145 225"
      stroke="url(#goldFeatherGrad)"
      stroke-width="3.5"
      stroke-linecap="round"
      fill="#1c1917"
    />
    <path
      d="M 138 235 C 130 255, 122 275, 116 288 C 110 292, 104 286, 108 275 C 114 258, 120 238, 126 220"
      stroke="url(#goldFeatherGrad)"
      stroke-width="3"
      stroke-linecap="round"
      fill="#1c1917"
    />
    <path
      d="M 178 220 L 195 265 L 202 278 L 198 280 L 188 268 L 175 228 Z"
      fill="url(#goldFeatherGrad)"
      stroke="#fde047"
      stroke-width="2"
    />
    <circle cx="204" cy="282" r="4" fill="#fde047" />
  </g>
</svg>
